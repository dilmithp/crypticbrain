name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/crypticbrain/frontend

      - name: SCP Frontend Files
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/.next/standalone/,frontend/public/,frontend/package.json,frontend/next.config.ts"
          target: "/home/ubuntu/crypticbrain/frontend/"
          strip_components: 1

      - name: Restart PM2 Service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Copy static files to standalone dir
            cp -r /home/ubuntu/crypticbrain/frontend/public /home/ubuntu/crypticbrain/frontend/.next/standalone/ || true
            cp -r /home/ubuntu/crypticbrain/frontend/.next/static /home/ubuntu/crypticbrain/frontend/.next/standalone/.next/ || true
            
            cd /home/ubuntu/crypticbrain/frontend/.next/standalone
            
            export PORT=3010
            export HOSTNAME="0.0.0.0"
            export NEXT_PUBLIC_API_URL=https://api.crypticbrain.dilmith.live:8191
            
            # Use pm2 to restart or start
            pm2 restart frontend || pm2 start server.js --name frontend
            pm2 save
            
            # Health check
            echo "Waiting for frontend to start..."
            for i in {1..15}; do
              curl -f http://localhost:3000 && break || sleep 2;
            done
