name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.crypticbrain.dilmith.live

      - name: Ensure frontend directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/crypticbrain/frontend

      - name: SCP standalone build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/.next/standalone/,frontend/.next/static/,frontend/public/"
          target: "/home/ubuntu/crypticbrain/frontend/"
          strip_components: 1

      - name: Copy static assets into standalone and restart PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            which pm2 || npm install -g pm2

            cp -r /home/ubuntu/crypticbrain/frontend/public /home/ubuntu/crypticbrain/frontend/.next/standalone/public
            mkdir -p /home/ubuntu/crypticbrain/frontend/.next/standalone/.next
            cp -r /home/ubuntu/crypticbrain/frontend/.next/static /home/ubuntu/crypticbrain/frontend/.next/standalone/.next/static

            cd /home/ubuntu/crypticbrain/frontend/.next/standalone

            export PORT=3000
            export HOSTNAME="0.0.0.0"
            export NEXT_PUBLIC_API_URL=https://api.crypticbrain.dilmith.live

            pm2 restart frontend || pm2 start server.js --name frontend
            pm2 save

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Waiting for frontend to start..."
            for i in {1..15}; do
              curl -sf http://localhost:3000 -o /dev/null && echo "Frontend is up!" && exit 0
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "Frontend health check failed" && exit 1
